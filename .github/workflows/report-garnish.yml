name: Report Garnish Snapshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print live garnish rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >-
          python pipeline/report_garnish_snapshot.py
          --match-id espn-1545664
          --match-id espn-1545665
          --match-id espn-1528554
          --match-id espn-1547987
          --match-id espn-1547096
          --match-id espn-1545667
          --match-id espn-1545666
          --match-id cricbuzz-ea958f3d3e9c46ad
