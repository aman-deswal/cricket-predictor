name: Fetch Squads & Player Stats

on:
  schedule:
    - cron: '37 */6 * * *'  # Every 6 hours; owns squads, player stats, and new-squad headshots
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squad-player-writes
  cancel-in-progress: false

jobs:
  fetch-squads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch squads
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_squads.py

      - name: Fetch player stats
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_player_stats.py

      - name: Fetch headshots for new squads
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_headshots.py
