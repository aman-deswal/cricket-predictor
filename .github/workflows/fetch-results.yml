name: Fetch Results

on:
  schedule:
    - cron: '0 * * * *'  # Every hour (backup scorer)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch results and score predictions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESULT_CHECK_BATCH_SIZE: '25'
        run: python pipeline/fetch_results.py
