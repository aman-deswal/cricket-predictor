name: Fetch Fixtures

on:
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours (ESPN is free/unlimited)
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fixtures
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_fixtures.py

      - name: Backup score pending results
        if: ${{ always() }}
        env:
          CRICAPI_KEY: ${{ secrets.CRICAPI_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RESULT_CHECK_BATCH_SIZE: '25'
        run: python pipeline/fetch_results.py
