name: Fetch Fixtures

on:
  schedule:
    - cron: '7,22,37,52 * * * *'  # Every 15 minutes; owns fixture discovery and ESPN match context
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fixture-context-writes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch fixtures
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_fixtures.py

      - name: Fetch match context
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_espn.py --limit 50
