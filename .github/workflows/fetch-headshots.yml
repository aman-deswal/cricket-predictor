name: Fetch Headshots

on:
  workflow_dispatch:  # Manual full-refresh recovery; scheduled headshots belong to Fetch Squads & Player Stats

permissions:
  contents: read

concurrency:
  group: headshot-writes
  cancel-in-progress: false

jobs:
  headshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch headshots
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python pipeline/fetch_headshots.py
