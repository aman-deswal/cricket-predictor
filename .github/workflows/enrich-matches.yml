name: Enrich Matches

on:
  workflow_run:
    workflows: ["Run Predictions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  # Garnish refreshes may be superseded and never queue ahead of deterministic writes.
  group: optional-match-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    # Enrichment is an optional post-prediction pass and never runs after a failed upstream refresh.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select garnish candidates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline/select_garnish_candidates.py --format text

      - name: Refresh garnish only
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ENABLE_LLM_GARNISH: ${{ vars.ENABLE_LLM_GARNISH || 'false' }}
          LLM_PROFILE: ${{ vars.LLM_PROFILE || 'balanced' }}
          LLM_PROFILE_MAP: ${{ vars.LLM_PROFILE_MAP || '' }}
          LLM_ROUTE_MAP: ${{ vars.LLM_ROUTE_MAP || '' }}
          LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS || '' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || '' }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://models.github.ai/inference' }}
        run: python pipeline/refresh_garnish.py
