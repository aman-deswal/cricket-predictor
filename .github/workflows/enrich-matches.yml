name: Enrich Matches

on:
  workflow_run:
    workflows: ["Run Predictions"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  models: read

concurrency:
  # Garnish refreshes may be superseded and never queue ahead of deterministic writes.
  group: optional-match-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    # Enrichment is an optional post-prediction pass and never runs after a failed upstream refresh.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Print live garnish rows
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: >-
          python pipeline/report_garnish_snapshot.py
          --match-id espn-1545664
          --match-id espn-1545665
          --match-id espn-1528554
          --match-id espn-1547987
          --match-id espn-1547096
          --match-id espn-1545667
          --match-id espn-1545666
          --match-id cricbuzz-ea958f3d3e9c46ad
